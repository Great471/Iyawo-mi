
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moira ❤️ Forever</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}
.card{
    backdrop-filter:blur(25px);
    background:rgba(255,255,255,0.08);
    padding:50px;
    border-radius:30px;
    width:95%;
    max-width:700px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
}
h1{font-family:'Playfair Display',serif;font-size:36px;margin-bottom:20px;}
.message{font-size:18px;margin-bottom:30px;line-height:1.7;}
.gallery{display:flex;justify-content:center;gap:20px;margin-bottom:30px;flex-wrap:wrap;}
.gallery img{
    width:200px;
    height:250px;
    object-fit:cover;
    border-radius:20px;
    border:3px solid #ff4e8a;
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
}
.btn{padding:14px 35px;border:none;border-radius:40px;font-size:16px;cursor:pointer;margin:10px;transition:0.3s;}
.yes{background:#ff4e8a;color:white;}
.yes:hover{transform:scale(1.1);box-shadow:0 0 25px #ff4e8a;}
.no{background:white;color:#ff4e8a;position:absolute;}
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:flex;
    justify-content:center;
    align-items:center;
    visibility:hidden;
    opacity:0;
    transition:0.4s;
}
.popup.show{visibility:visible;opacity:1;}
.popup-content{
    background:white;
    color:#ff4e8a;
    padding:50px;
    border-radius:25px;
    text-align:center;
    font-family:'Playfair Display',serif;
    font-size:22px;
    line-height:1.6;
}
</style>
</head>

        Will you be my Valentine?
